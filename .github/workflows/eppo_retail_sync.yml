name: EPPO & Retail Price Auto-Sync

on:
  schedule:
    # 05:05, 11:00, and 17:30 Bangkok Time (UTC+7)
    - cron: '5 22 * * *'
    - cron: '0 4 * * *'
    - cron: '30 10 * * *'
  workflow_dispatch:
    inputs:
      backfill_all:
        description: 'Scan ALL historical EPPO pages (500+ pages, full DB backfill)'
        required: false
        type: boolean
        default: false
      force_refresh:
        description: 'Force re-download and re-parse cached files'
        required: false
        type: boolean
        default: false
      max_pages:
        description: 'Max pages to scan if backfill_all is false (0 = unlimited)'
        required: false
        type: string
        default: '3'
      min_year:
        description: 'Earliest year to include during backfill (e.g. 2017 = 10 years)'
        required: false
        type: string
        default: '2017'

permissions:
  contents: write

jobs:
  sync:
    name: Extract, Transform & Synchronize EPPO Data
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute EPPO & Retail ETL Pipeline
        timeout-minutes: 180
        env:
          BACKFILL_ALL: ${{ github.event.inputs.backfill_all || 'false' }}
          FORCE_REFRESH: ${{ github.event.inputs.force_refresh || 'false' }}
          MAX_PAGES: ${{ github.event.inputs.max_pages || '3' }}
          MIN_YEAR: ${{ github.event.inputs.min_year || '2017' }}
        run: |
          python -u .github/scripts/sync_eppo.py

      - name: Commit & Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/ frontend/public/data/

          if git diff --staged --quiet; then
            echo "No data changes detected. Everything is up to date."
          else
            TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
            git commit -m "[ETL] Auto-sync EPPO Price Structure - ${TIMESTAMP} [skip ci]"
            git push origin main
            echo "Successfully committed and pushed updated EPPO data."
          fi
